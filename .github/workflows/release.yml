name: Build and Push Docker Image to GHCR
## old working - add: to tag short sha hash to build | 4450c59da246a6d429c2bdfce42b0d0bdc17f375
#on:
#  push:
#    branches: [ "main" ] # Срабатывает при пуше в вашу главную ветку
on:
  workflow_dispatch: # Включает магическую кнопку на GitHub для ручного запуска
  push:
    tags:
      - 'v*.*.*'       # Запускает сборку автоматически при пуше тегов (например, v1.0.0)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Автоматически подставит имя вашего репо
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Токен создается GitHub автоматически

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.ref_name }}-sha-${{ github.sha }}