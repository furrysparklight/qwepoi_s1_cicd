name: Build and Release API

on:
  workflow_dispatch: # Кнопка "Run workflow"
  push:
    branches:
      - 'main'      # Сборка при пуше в main
      - 'dev'       # Сборка при пуше в dev
    tags:
      - 'v*.*'       # Включает v2.7, v2.7-beta
      - '!v*.*.*'    # ИСКЛЮЧАЕТ v2.7.1, v2.7-beta.14 (если там 3 сегмента через точку)
  release:
    types: [published] # Сборка при создании релиза на GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          # Здесь магия: мы создаем разные теги в зависимости от события
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}